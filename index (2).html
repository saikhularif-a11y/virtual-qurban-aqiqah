const C={1:`<h2>Pos 1 · Pengertian Qurban &amp; Aqiqah</h2><p><b>Qurban</b>: secara bahasa dari <i>qaraba</i> (mendekatkan diri). Secara istilah, menyembelih hewan ternak tertentu pada Idul Adha (10 Dzulhijjah) dan hari tasyrik (11–13) sebagai ibadah kepada Allah. Hukumnya sunnah muakkadah menurut jumhur ulama (mazhab Hanafi: wajib bagi yang mampu).</p><p><b>Aqiqah</b>: sembelihan sebagai wujud syukur atas kelahiran anak; hukumnya sunnah muakkadah menurut jumhur ulama.</p><div class=ar>فَصَلِّ لِرَبِّكَ وَانْحَرْ</div><p><i>Fa shalli li rabbika wanhar.</i> “Maka laksanakanlah salat karena Tuhanmu, dan berqurbanlah.” (QS. Al-Kautsar: 2)</p><ul><li><b>Beda:</b> qurban terikat waktu Idul Adha; aqiqah terkait kelahiran anak.</li><li><b>Hikmah:</b> ketakwaan, syukur, meneladani Nabi Ibrahim, berbagi dengan sesama.</li></ul>`,
2:`<h2>Pos 2 · Ketentuan Hewan Qurban</h2><ul><li><b>Jenis:</b> unta, sapi/kerbau, kambing, dan domba (hewan ternak; QS. Al-Hajj: 34).</li><li><b>Umur minimal</b> (pendapat yang umum, mazhab Syafi'i): unta 5 tahun, sapi 2 tahun, kambing 2 tahun, domba 1 tahun. Rincian umur dapat berbeda antarulama.</li><li><b>Sehat &amp; tidak cacat:</b> tidak sah bila buta sebelah yang jelas, sakit jelas, pincang jelas, atau sangat kurus (HR. Abu Dawud dan At-Tirmidzi).</li><li><b>Jumlah:</b> 1 kambing/domba untuk 1 orang (pahalanya boleh meliputi keluarganya); 1 sapi/unta untuk 7 orang (HR. Muslim).</li><li><b>Waktu:</b> setelah salat Idul Adha (10 Dzulhijjah) hingga akhir hari tasyrik (13 Dzulhijjah) menurut pendapat yang umum.</li><li><b>Pembagian:</b> sebagian dimakan shohibul qurban, sebagian disedekahkan kepada fakir miskin; pola sepertiga bukan satu-satunya ketentuan. Upah penyembelih tidak diambil dari daging qurban.</li></ul><p>💡 Ketuk/klik hewan di kandang untuk melihat infonya.</p>`,
3:`<h2>Pos 3 · Ketentuan Aqiqah</h2><ul><li><b>Hukum:</b> sunnah muakkadah menurut jumhur ulama.</li><li><b>Waktu:</b> dianjurkan hari ketujuh kelahiran; bila terlewat, sebagian ulama membolehkan di hari lain.</li><li><b>Hewan:</b> kambing, dengan syarat umumnya seperti hewan qurban (sehat dan tidak cacat); sebagian ulama membolehkan sapi/unta.</li><li><b>Jumlah:</b> anak laki-laki dua kambing, anak perempuan satu kambing.</li><li><b>Pengolahan:</b> dianjurkan dimasak lalu dibagikan kepada tetangga dan fakir miskin; keluarga boleh ikut makan. Ulama memiliki rincian yang beragam.</li><li><b>Hikmah:</b> syukur, berbagi kebahagiaan, mempererat silaturahmi, mendoakan anak.</li></ul><div class=ar>عَنِ الْغُلَامِ شَاتَانِ مُكَافِئَتَانِ وَعَنِ الْجَارِيَةِ شَاةٌ</div><p>“Untuk anak laki-laki dua ekor kambing yang sepadan, dan untuk anak perempuan satu ekor kambing.” (HR. Ahmad dan At-Tirmidzi dari 'Aisyah r.a.)</p><div class=ar>كُلُّ غُلَامٍ مُرْتَهَنٌ بِعَقِيقَتِهِ تُذْبَحُ عَنْهُ يَوْمَ سَابِعِهِ وَيُحْلَقُ وَيُسَمَّى</div><p>“Setiap anak tergadai dengan aqiqahnya; disembelih pada hari ketujuh, dicukur rambutnya, dan diberi nama.” (HR. Abu Dawud, At-Tirmidzi, An-Nasa'i, Ibnu Majah dari Samurah r.a.)</p>`,
4:`<h2>Pos 4 · Tata Cara Penyembelihan</h2><p>Demonstrasi simbolis (tanpa visual grafis). Langkah menyala bergantian:</p><ol class=st>${stp.map((s,i)=>`<li style="animation-delay:${i*1.5}s">${s}</li>`).join('')}</ol><p>“Sesungguhnya Allah mewajibkan ihsan atas segala sesuatu… jika kalian menyembelih, sembelihlah dengan baik; tajamkanlah pisaunya dan senangkanlah hewan sembelihannya.” (HR. Muslim)</p><p><b>Beribadah dengan benar, memperlakukan hewan dengan ihsan, serta menjaga kebersihan dan keselamatan.</b></p>`,
5:`<h2>Pos 5 · Pembagian Daging</h2><ul><li><b>Tujuan:</b> berbagi kebahagiaan, peduli sesama, mempererat persaudaraan.</li><li><b>Penerima daging qurban:</b> shohibul qurban dan keluarga, fakir miskin, tetangga, dan kerabat.</li><li><b>Adab:</b> adil, bersih, rapi, amanah, diantar dengan sopan; utamakan yang paling membutuhkan.</li><li><b>Qurban vs aqiqah:</b> daging qurban umumnya dibagikan mentah, hidangan aqiqah dianjurkan dimasak. Pola pembagian beragam menurut ulama; tidak ada satu pola yang dianggap satu-satunya.</li></ul>`};

function maze(){const N=8,cs=36,dr=[[0,-1],[1,0],[0,1],[-1,0]],g=[...Array(N)].map(()=>[...Array(N)].map(()=>({w:[1,1,1,1],v:0})));

function dw(){cx.clearRect(0,0,288,288);cx.strokeStyle='#2f5d46';cx.lineWidth=3;cx.beginPath();g.forEach((row,y)=>row.forEach((c,x)=>{const X=x*cs,Y=y*cs;if(c.w[0]){cx.moveTo(X,Y);cx.lineTo(X+cs,Y)}if(c.w[1]){cx.moveTo(X+cs,Y);cx.lineTo(X+cs,Y+cs)}if(c.w[2]){cx.moveTo(X,Y+cs);cx.lineTo(X+cs,Y+cs)}if(c.w[3]){cx.moveTo(X,Y);cx.lineTo(X,Y+cs)}}));cx.stroke();cx.font='22px serif';cx.textAlign='center';cx.textBaseline='middle';
hs.forEach(h=>cx.fillText(h.d?'✅':'🏠',h.x*cs+cs/2,h.y*cs+cs/2));cx.fillText('🧑',p.x*cs+cs/2,p.y*cs+cs/2)}
