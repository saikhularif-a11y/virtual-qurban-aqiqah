const C={1:`<h2>Pos 1 · Pengertian Penyembelihan, Kurban &amp; Akikah</h2><details><summary><b>🎯 Tujuan Pembelajaran</b></summary><ul><li>Menjelaskan pengertian dan hukum penyembelihan, kurban, dan akikah.</li><li>Mengidentifikasi syarat penyembelih, alat, hewan, dan tata cara sesuai syariat.</li><li>Menjelaskan ketentuan hewan kurban dan akikah serta waktunya.</li><li>Membedakan kurban dan akikah.</li><li>Menunjukkan sikap ikhlas, amanah, peduli sesama, bertanggung jawab, dan menyayangi hewan.</li><li>Menerapkan pemahaman fikih dalam kegiatan Iduladha dan kehidupan pesantren.</li></ul></details><p><b>Penyembelihan hewan</b> adalah proses mematikan hewan yang halal dimakan dengan cara yang dibenarkan syariat agar dagingnya halal dikonsumsi; wujud ketaatan kepada Allah Swt. dan kasih sayang kepada makhluk hidup.</p><p><b>Hukum:</b> hewan darat yang mati tanpa penyembelihan yang sah pada dasarnya bangkai, kecuali yang dikecualikan syariat.</p><div class=ar>حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ وَالدَّمُ وَلَحْمُ الْخِنْزِيرِ</div><p>“Diharamkan bagimu bangkai, darah, dan daging babi…” (QS. Al-Mā’idah [5]: 3, penggalan ayat)</p><p><b>Kurban (udhiyah)</b>: ibadah menyembelih hewan ternak tertentu pada 10–13 Zulhijah untuk mendekatkan diri kepada Allah Swt. Hukumnya sunah muakkadah bagi yang mampu.</p><div class=ar>فَصَلِّ لِرَبِّكَ وَانْحَرْ</div><p>“Maka, laksanakanlah salat karena Tuhanmu dan berkurbanlah!” (QS. Al-Kauṡar [108]: 2)</p><div class=ar>لَنْ يَنَالَ اللَّهَ لُحُومُهَا وَلَا دِمَاؤُهَا وَلَٰكِنْ يَنَالُهُ التَّقْوَىٰ مِنْكُمْ</div><p>“Daging-daging (hewan kurban) dan darahnya itu sekali-kali tidak akan sampai kepada Allah, tetapi yang sampai kepada-Nya adalah ketakwaanmu.” (QS. Al-Ḥajj [22]: 37)</p><p><b>Akikah</b>: penyembelihan hewan karena kelahiran anak sebagai wujud syukur kepada Allah Swt.; hukumnya sunah muakkadah bagi yang mampu.</p>`,
2:`<h2>Pos 2 · Ketentuan Hewan Kurban</h2><ul><li><b>Jenis &amp; umur minimal:</b> kambing/domba 1 tahun (untuk 1 pekurban); sapi/kerbau 2 tahun, memasuki tahun ke-3 (maks. 7 pekurban); unta 5 tahun, memasuki tahun ke-6 (maks. 7 pekurban). Sebagian ulama mensyaratkan kambing 2 tahun.</li><li><b>Cacat berat (tidak sah):</b> buta yang jelas, sakit yang nyata, pincang yang jelas, dan sangat kurus (tidak bersumsum).</li><li><b>Waktu:</b> 10 Zulhijah (Iduladha) setelah salat Iduladha; 11–13 Zulhijah (hari tasyrik) hingga matahari terbenam tanggal 13 Zulhijah.</li><li><b>Pembagian:</b> kepada fakir miskin, tetangga, kerabat, serta keluarga pekurban (QS. Al-Ḥajj [22]: 28).</li><li><b>Ketentuan penting:</b> daging kurban tidak boleh diperjualbelikan untuk keuntungan pribadi, dan upah jagal tidak boleh dibayar dengan daging kurban (gunakan dana operasional lain).</li></ul><p>💡 Ketuk/klik hewan di kandang untuk melihat infonya.</p>`,
3:`<h2>Pos 3 · Ketentuan Akikah</h2><ul><li><b>Hukum:</b> sunah muakkadah bagi yang mampu.</li><li><b>Jumlah hewan:</b> anak laki-laki 2 ekor kambing/domba; anak perempuan 1 ekor kambing/domba.</li><li><b>Waktu:</b> paling utama hari ketujuh setelah kelahiran; jika belum mampu, dapat dilaksanakan pada hari ke-14 atau ke-21.</li><li><b>Pengolahan:</b> lazimnya dimasak terlebih dahulu (gulai/sate) lalu dibagikan.</li></ul><div class=ar>كُلُّ غُلَامٍ رَهِينَةٌ بِعَقِيقَتِهِ، تُذْبَحُ عَنْهُ يَوْمَ سَابِعِهِ، وَيُحْلَقُ، وَيُسَمَّى</div><p>“Setiap anak tergadai dengan akikahnya. Disembelihkan hewan untuknya pada hari ketujuh, rambutnya dicukur, dan ia diberi nama.” (HR. Abu Dawud no. 2838 dan at-Tirmidzi no. 1522)</p><h3>Perbedaan Kurban &amp; Akikah</h3><table><tr><th>Aspek<th>Kurban<th>Akikah<tr><td>Pengertian<td>Menyembelih hewan ternak pada Iduladha<td>Menyembelih hewan karena kelahiran anak<tr><td>Waktu utama<td>10–13 Zulhijah<td>Hari ketujuh kelahiran<tr><td>Jenis hewan<td>Unta, sapi, kerbau, kambing, domba<td>Umumnya kambing atau domba<tr><td>Jumlah<td>Kambing (1 orang), sapi (maks. 7 orang)<td>Laki-laki 2 ekor, perempuan 1 ekor<tr><td>Pengolahan<td>Dapat dibagikan sebagai daging mentah<td>Lazimnya dimasak terlebih dahulu</table>`,
4:`<h2>Pos 4 · Tata Cara Penyembelihan</h2><p>Demonstrasi simbolis (tanpa visual grafis). Langkah menyala bergantian:</p><ol class=st>${stp.map((s,i)=>`<li style="animation-delay:${i*3}s">${s}</li>`).join('')}</ol><ul><li><b>Syarat penyembelih:</b> beragama Islam (atau sembelihannya diakui halal menurut syariat, seperti Ahli Kitab dalam ketentuan tertentu), berakal sehat, sengaja menyembelih, membaca bismillāh, dan tidak untuk selain Allah.</li><li><b>Syarat hewan:</b> jenis hewan yang halal dimakan, masih hidup saat penyembelihan dimulai, dan disembelih sesuai syariat.</li><li><b>Syarat alat:</b> tajam dan memotong dengan cepat, bukan dari tulang atau kuku, dan bukan alat yang dilarang syariat.</li></ul><div class=ar>إِنَّ اللَّهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ</div><p>“Sesungguhnya Allah menetapkan berbuat ihsan atas segala sesuatu.” (HR. Muslim no. 1955) Artinya, sembelihlah dengan baik dan hindari penderitaan hewan.</p><p><b>⚠️ Hindari:</b> alat tumpul; menyakiti atau memukul hewan; menajamkan pisau di hadapan hewan; menguliti/memotong sebelum hewan mati sempurna; mengotori daging dengan darah atau kotoran yang membahayakan kesehatan.</p><p><b>Beribadah dengan benar, memperlakukan hewan dengan ihsan, serta menjaga kebersihan dan keselamatan.</b></p>`,
5:`<h2>Pos 5 · Pembagian Daging &amp; Nilai Santri</h2><ul><li><b>Tujuan:</b> berbagi kebahagiaan, peduli sesama, mempererat persaudaraan.</li><li><b>Penerima daging kurban:</b> fakir miskin, tetangga, kerabat, dan keluarga pekurban (QS. Al-Ḥajj [22]: 28).</li><li><b>Adab:</b> adil, bersih, rapi, amanah, dan diantar dengan sopan; utamakan yang paling membutuhkan.</li><li><b>Larangan:</b> daging kurban tidak diperjualbelikan, dan upah jagal tidak diambil dari daging kurban.</li></ul><h3>Penerapan dalam Kehidupan Santri DAFI</h3><ul><li><b>Amanah dalam kepanitiaan:</b> menjalankan tugas sosial/pesantren dengan jujur dan bertanggung jawab.</li><li><b>Peduli sesama:</b> membantu pendistribusian bantuan secara tertib dan adil kepada yang membutuhkan.</li><li><b>Belajar berkorban:</b> mengorbankan waktu santai untuk belajar, membantu teman, dan menaati tata tertib pesantren.</li></ul>`};
